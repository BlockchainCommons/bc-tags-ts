name: Continuous Integration

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Run linter
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun run test

      - name: Check public API surface
        run: bun run api:check

      - name: Check bundle size
        run: bun run size

      - name: Validate package
        run: bun run lint:pkg

      - name: Check dependency hygiene
        run: bun run check:deps

  rust-validation:
    name: Cross-validate vectors against the Rust reference
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The runner image ships a stable Rust toolchain. The default build is
      # the reference every Rust consumer uses (dcbor without num-bigint).
      - name: Validate against bc-tags (default build)
        working-directory: tests/rust-validation
        run: cargo run --release --locked -- ../vectors/vectors.json

      - name: Validate the bignum recipe (num-bigint build)
        working-directory: tests/rust-validation
        run: cargo run --release --locked --features bignum -- ../vectors/vectors.json

      # The identifier check must bite: the swapped-label fixture fails with
      # exactly two identifier mismatches.
      - name: Reject the swapped-identifier fixture
        working-directory: tests/rust-validation
        run: |
          set +e
          output=$(cargo run --release --locked --quiet -- fixtures/swapped-identifiers.json 2>&1 >/dev/null)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          test "$(printf '%s\n' "$output" | grep -c '^MISMATCH ident ')" -eq 2
