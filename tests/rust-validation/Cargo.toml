[package]
name = "tags-validation"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bc-tags = "=0.12.0"
# TypeScript always registers bignum tags. Enable the corresponding Rust
# feature for comparison; see RUST_DIVERGENCES.md. Without it, probes 2 and 3 differ.
dcbor = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
