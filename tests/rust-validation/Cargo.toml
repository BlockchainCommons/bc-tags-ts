[package]
name = "tags-validation"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bc-tags = "=0.12.0"
# num-bigint: TypeScript always registers the bignum tags (2, 3); Rust only
# with this feature. Enabled so the registries compare like for like.
dcbor = { version = "0.25", features = ["num-bigint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
